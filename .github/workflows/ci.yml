name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Tests (pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_USER_ID: ${{ vars.DIFY_USER_ID }}
          DIFY_USER_IDS: ${{ vars.DIFY_USER_IDS }}
          DIFY_BASE_URL: ${{ vars.DIFY_BASE_URL }}
          TEST_START_TIME: ${{ vars.TEST_START_TIME }}
          TEST_END_TIME: ${{ vars.TEST_END_TIME }}
        run: |
          # 运行不需要fork模式的测试（排除E2E和需要fork的工具测试）
          pytest tests/unit/utils/ tests/integration/ -q --tb=short
          
          # 运行需要fork模式的工具测试（排除E2E）
          pytest tests/unit/tools/ --forked -q --tb=short
