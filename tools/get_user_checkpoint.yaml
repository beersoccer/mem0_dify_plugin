identity:
  author: mikuagent
  name: get_user_checkpoint
  label:
    en_US: Get User Checkpoint
    zh_Hans: 获取用户Checkpoint
description:
  human:
    en_US: Get the extraction checkpoint for a required user and robot/app namespace.
    zh_Hans: 获取指定用户与机器人/应用命名空间的记忆提取Checkpoint。
  llm: Get the extraction checkpoint for a required user_id and app_id namespace.
parameters:
  - name: user_id
    type: string
    required: true
    label:
      en_US: User ID
      zh_Hans: 用户ID
    human_description:
      en_US: User ID whose checkpoint you want to view.
      zh_Hans: 要查看Checkpoint的用户ID。
    llm_description: User ID whose checkpoint you want to view.
    form: llm
  - name: app_id
    type: string
    required: true
    label:
      en_US: Robot / App ID
      zh_Hans: 机器人/应用ID
    human_description:
      en_US: Required robot/app identifier used with user_id to scope the checkpoint.
      zh_Hans: 必填。与 user_id 一起限定Checkpoint范围的机器人/应用ID。
    llm_description: Required robot/app identifier. It maps to the same namespace as agent_id.
    form: llm
extra:
  python:
    source: tools/get_user_checkpoint.py

