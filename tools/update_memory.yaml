identity:
  name: update_memory
  author: mikuagent
  label:
    en_US: Update Memory
    zh_Hans: 更新记忆
description:
  human:
    en_US: Modify an existing memory by updating its content
    zh_Hans: 通过更新内容来修改现有记忆
  llm: Use this tool to modify and update the content of an existing memory in Mem0 by its ID.
parameters:
  - name: memory_id
    type: string
    required: true
    label:
      en_US: Memory ID
      zh_Hans: 记忆ID
    human_description:
      en_US: The unique UUID of the memory to update.
      zh_Hans: 要更新的记忆的唯一UUID。
    llm_description: The unique UUID of the memory to update.
    form: llm
  - name: text
    type: string
    required: true
    label:
      en_US: New Memory Text
      zh_Hans: 新的记忆文本
    human_description:
      en_US: The new text content for the memory.
      zh_Hans: 记忆的新文本内容。
    llm_description: The new text content for the memory.
    form: llm
  - name: user_id
    type: string
    required: true
    label:
      en_US: User ID
      zh_Hans: 用户ID
    human_description:
      en_US: Required user identifier used to verify ownership before updating.
      zh_Hans: 必填。更新前用于验证记忆归属的用户ID。
    llm_description: Required user identifier. Must match the user_id stored on the memory.
    form: llm
  - name: agent_id
    type: string
    required: true
    label:
      en_US: Robot / Agent ID
      zh_Hans: 机器人ID
    human_description:
      en_US: Required robot identifier used with user_id to verify ownership before updating.
      zh_Hans: 必填。与 user_id 一起在更新前验证记忆归属的机器人ID。
    llm_description: Required robot/agent identifier. Must match the agent_id stored on the memory.
    form: llm
  - name: run_id
    type: string
    required: false
    label:
      en_US: Run ID
      zh_Hans: 运行ID
    human_description:
      en_US: "Optional unique identifier for tracking the entire memory operation call chain. Recommended to use Dify's workflow_run_id to link multiple memory operations in the same workflow. Note: This parameter is only for tracing the call chain and is NOT used as a condition for memory layering or filtering."
      zh_Hans: 可选的唯一标识符，用于追踪整个记忆操作调用链。推荐使用 Dify 的 workflow_run_id 来关联同一工作流中的多个记忆操作。注意：此参数仅用于追踪调用链，不作为记忆分层或过滤的条件。
    llm_description: "Optional unique identifier for tracking the entire memory operation call chain. Recommended to use Dify's workflow_run_id to link multiple memory operations in the same workflow. This parameter is only for tracing and is NOT used as a condition for memory layering or filtering."
    form: llm
  - name: timeout
    type: number
    required: false
    label:
      en_US: Timeout (seconds)
      zh_Hans: 超时时间（秒）
    human_description:
      en_US: Optional timeout in seconds for the update operation (async mode only). Defaults to 15 if not specified. Only applies when async_mode=true.
      zh_Hans: 可选，更新记忆操作的超时时间（秒，仅异步模式）。未指定时默认为 15 秒。仅在 async_mode=true 时生效。
    llm_description: Optional timeout in seconds for the update operation (async mode only). Defaults to 15 if not specified. Only applies when async_mode=true.
    form: form
extra:
  python:
    source: tools/update_memory.py
